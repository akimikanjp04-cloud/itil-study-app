<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#3478f6"
    >

    <meta
        name="description"
        content="ITIL Foundationをスマートフォンで学習するための学習アプリ"
    >

    <title>ITIL Foundation 学習アプリ</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<main class="app">

    <!-- ホーム -->

    <section id="home-screen">

        <header class="header">
            <h1>ITIL Foundation</h1>
            <p>学習アプリ</p>
        </header>

        <section class="today-card">

            <h2>今日の学習</h2>

            <div class="progress-text">
                まだ学習していません
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </section>

        <section class="menu">

            <button
                class="menu-button"
                onclick="showCategoryScreen()"
            >
                <span class="icon">📖</span>

                <span>
                    <strong>分野別学習</strong>
                    <small>テーマごとに学習する</small>
                </span>
            </button>

            <button
                class="menu-button"
                onclick="startQuiz()"
            >
                <span class="icon">❓</span>

                <span>
                    <strong>一問一答</strong>
                    <small>問題を解いて覚える</small>
                </span>
            </button>

            <button
                class="menu-button"
                onclick="startWeakQuiz()"
            >
                <span class="icon">🔥</span>

                <span>
                    <strong>苦手問題</strong>
                    <small id="weak-summary">
                        間違えた問題を復習する
                    </small>
                </span>
            </button>

            <button
                class="menu-button"
                onclick="showMockExamIntro()"
            >
                <span class="icon">📝</span>

                <span>
                    <strong>模擬試験</strong>
                    <small>40問・60分の本番形式</small>
                </span>
            </button>

            <button class="menu-button" onclick="showGlossary()">
                <span class="icon">📚</span>

                <span>
                    <strong>用語集</strong>
                    <small>重要用語を確認する</small>
                </span>
            </button>

            <button
                class="menu-button"
                onclick="showStats()"
            >
                <span class="icon">📊</span>

                <span>
                    <strong>学習成績</strong>
                    <small>これまでの成績を見る</small>
                </span>
            </button>

        </section>

    </section>


    <!-- 分野別学習 -->

    <section
        id="category-screen"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← ホーム
        </button>

        <header class="sub-header">
            <h1>📖 分野別学習</h1>
            <p>学習する分野を選んでください</p>
        </header>

        <div id="category-list"></div>

    </section>


    <!-- 通常問題 -->

    <section
        id="quiz-screen"
        style="display:none;"
    ></section>


    <!-- 模擬試験 -->

    <section
        id="mock-screen"
        style="display:none;"
    ></section>


    <!-- 用語集 -->
    <section id="glossary-screen" style="display:none;">
        <button class="back-button" onclick="goHome()">← ホーム</button>
        <header class="sub-header">
            <h1>📚 用語集</h1>
            <p>重要用語を検索・復習</p>
        </header>
        <div class="glossary-tools">
            <input id="glossary-search" class="glossary-search" type="search"
                   placeholder="日本語・英語で検索" oninput="renderGlossary()">
            <select id="glossary-category" class="glossary-select" onchange="renderGlossary()"></select>
            <label class="glossary-check">
                <input id="glossary-important" type="checkbox" onchange="renderGlossary()">
                ★★★ 重要語だけ
            </label>
        </div>
        <div id="glossary-count" class="glossary-count"></div>
        <div id="glossary-list"></div>
    </section>


    <!-- 学習成績 -->

    <section
        id="stats-screen"
        style="display:none;"
    >

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← ホーム
        </button>

        <header class="stats-header">
            <h1>📊 学習成績</h1>
            <p>これまでの学習状況</p>
        </header>

        <div id="stats-content"></div>

    </section>


    <footer>
        ITIL Foundation Study App
    </footer>

</main>


<script src="js/app.js"></script>

<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(registration => {
                console.log(
                    "Service Worker registered:",
                    registration.scope
                );
            })
            .catch(error => {
                console.error(
                    "Service Worker registration failed:",
                    error
                );
            });
    });
}
</script>

</body>
</html>
